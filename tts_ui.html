<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fish Speech S2 — Tamil TTS Studio & Voice Cloning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
    }

    .studio-wrapper {
      width: 100%;
      max-width: 900px;
    }

    /* Main Card */
    .editor-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.04);
      padding: 24px 24px 18px 24px;
      position: relative;
    }

    /* Top Translator Bar inside Card */
    .translator-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
      flex-wrap: wrap;
      gap: 10px;
    }

    .translator-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-trans {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: #1e293b;
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .btn-trans:hover {
      background: #e2e8f0;
      color: #0f172a;
      transform: translateY(-1px);
    }
    .btn-trans.primary {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #ffffff;
      border: none;
      box-shadow: 0 2px 6px rgba(99, 102, 241, 0.25);
    }
    .btn-trans.primary:hover {
      background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
      box-shadow: 0 3px 8px rgba(99, 102, 241, 0.35);
    }

    .auto-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
      font-weight: 500;
      color: #64748b;
      cursor: pointer;
      user-select: none;
    }
    .auto-toggle input {
      accent-color: #6366f1;
      cursor: pointer;
    }

    /* Textarea */
    textarea {
      width: 100%;
      min-height: 140px;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 1.05rem;
      color: #0f172a;
      line-height: 1.6;
      resize: none;
      background: transparent;
    }
    textarea::placeholder {
      color: #94a3b8;
    }

    /* Translation Live Feedback Card */
    .trans-feedback {
      display: none;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 14px;
      margin-top: 10px;
      margin-bottom: 12px;
      font-size: 0.82rem;
      color: #334155;
      position: relative;
    }
    .trans-feedback.show {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .trans-text {
      flex: 1;
    }
    .trans-btn-apply {
      background: #0f172a;
      color: #ffffff;
      border: none;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Quick Preset Prompt Pills */
    .prompt-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .prompt-pills::-webkit-scrollbar { display: none; }

    .pill {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 4px 10px;
      font-size: 0.73rem;
      color: #475569;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .pill:hover {
      background: #f1f5f9;
      color: #0f172a;
      border-color: #cbd5e1;
    }

    /* Bottom Bar */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 14px;
      border-top: 1px solid #f1f5f9;
      position: relative;
      flex-wrap: wrap;
      gap: 12px;
    }

    .controls-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .model-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #eff6ff;
      border: 1px solid #dbeafe;
      color: #1e40af;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.76rem;
      font-weight: 600;
    }

    .voice-selector-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 5px 12px 5px 6px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      color: #0f172a;
      transition: all 0.15s ease;
    }
    .voice-selector-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .avatar-circle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }

    .btn-clone-trigger {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .btn-clone-trigger:hover {
      background: #dcfce7;
      transform: translateY(-1px);
    }

    .more-options-btn {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .more-options-btn:hover {
      color: #0f172a;
      background: #f1f5f9;
    }

    /* Voice Dropdown Menu */
    .dropdown-menu {
      position: absolute;
      bottom: 50px;
      left: 140px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.12);
      width: 320px;
      max-height: 380px;
      overflow-y: auto;
      padding: 8px;
      display: none;
      z-index: 100;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: #94a3b8;
      padding: 6px 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .dropdown-item:hover {
      background: #f8fafc;
    }
    .dropdown-item.active {
      background: #f1f5f9;
      font-weight: 600;
    }
    .item-avatar {
      font-size: 1.1rem;
    }
    .item-text {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .item-name {
      font-size: 0.82rem;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .item-badge {
      font-size: 0.65rem;
      padding: 1px 6px;
      border-radius: 6px;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 600;
    }
    .item-sub {
      font-size: 0.7rem;
      color: #64748b;
    }

    /* Settings Popover */
    .settings-popover {
      position: absolute;
      bottom: 50px;
      left: 280px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.12);
      width: 260px;
      padding: 16px;
      display: none;
      z-index: 100;
    }
    .settings-popover.show { display: block; }
    .setting-row {
      margin-bottom: 12px;
    }
    .setting-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.74rem;
      color: #475569;
      font-weight: 600;
      margin-bottom: 5px;
    }
    input[type=range] {
      width: 100%;
      accent-color: #0f172a;
    }

    /* Generate Button */
    .btn-generate {
      background: #0f172a;
      color: #ffffff;
      border: none;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-generate:hover:not(:disabled) {
      background: #334155;
      transform: translateY(-1px);
    }
    .btn-generate:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Output Audio Player */
    .audio-player-card {
      display: none;
      margin-top: 16px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }
    .audio-player-card.show {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    audio {
      flex: 1;
      height: 38px;
      outline: none;
    }
    .download-btn {
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .download-btn:hover {
      background: #e2e8f0;
    }

    #status {
      margin-top: 10px;
      font-size: 0.8rem;
      text-align: center;
      color: #64748b;
    }
    #status.error { color: #ef4444; }
    #status.success { color: #10b981; }

    /* Modal Dialog */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-backdrop.show {
      display: flex;
    }
    .modal-box {
      background: #ffffff;
      border-radius: 20px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      padding: 24px;
      position: relative;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-close-modal {
      background: #f1f5f9;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: #64748b;
    }
    .btn-close-modal:hover {
      background: #e2e8f0;
      color: #0f172a;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 0.88rem;
      outline: none;
    }
    .form-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.15);
    }
    .icon-selector {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .icon-opt {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      background: #f8fafc;
    }
    .icon-opt.active {
      border-color: #6366f1;
      background: #eff6ff;
    }
    .audio-dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
      transition: all 0.15s;
    }
    .audio-dropzone:hover {
      border-color: #6366f1;
      background: #eff6ff;
    }
    .mic-record-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px 14px;
      border-radius: 12px;
      margin-top: 10px;
    }
    .btn-mic {
      background: #ef4444;
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-mic.recording {
      animation: pulse 1s infinite;
      background: #dc2626;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
    .btn-clone-submit {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #ffffff;
      border: none;
      padding: 11px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 14px;
      box-shadow: 0 3px 10px rgba(99, 102, 241, 0.25);
    }
    .btn-clone-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
    }
    .btn-clone-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="studio-wrapper">
    <!-- Main Clean Editor Card -->
    <div class="editor-card">
      
      <!-- In-Built Translator Action Bar -->
      <div class="translator-bar">
        <div class="translator-actions">
          <button class="btn-trans primary" id="btnTranslate" title="Translate English words/sentences to authentic Tamil">
            🌐 Translate to Tamil
          </button>
          <button class="btn-trans" id="btnTransliterate" title="Convert English phonetic typing (Tanglish) to Tamil script">
            🔤 Tanglish Phonetic
          </button>
          <button class="btn-trans" id="btnClear" title="Clear text">
            ✕ Clear
          </button>
        </div>
        <label class="auto-toggle" title="Automatically translates English text to Tamil upon clicking Generate">
          <input type="checkbox" id="autoTranslateToggle" checked />
          <span>Auto-Translate English</span>
        </label>
      </div>

      <textarea
        id="textInput"
        placeholder="Type in English (e.g. 'Hello everyone, welcome!'), Tanglish ('Vanakkam'), or native Tamil..."
      >வணக்கம், நீங்கள் அனைவரும் எப்படி இருக்கிறீர்கள்? இன்று வானிலை மிகவும் இனிமையாகவும் அமைதியாகவும் உள்ளது.</textarea>

      <!-- Translation Live Feedback Bar -->
      <div class="trans-feedback" id="transFeedback">
        <div class="trans-text" id="transFeedbackText"></div>
        <button class="trans-btn-apply" id="btnApplyTrans">Apply Translated Text</button>
      </div>

      <!-- Quick Preset Prompt Pills -->
      <div class="prompt-pills">
        <button class="pill" data-text="வணக்கம்! நீங்கள் அனைவரும் எப்படி இருக்கிறீர்கள்?">👋 Greeting (Tamil)</button>
        <button class="pill" data-text="Welcome everyone, how are you all doing today?">👋 Greeting (English)</button>
        <button class="pill" data-text="தமிழ் மொழி உலகிலேயே மிக தொன்மையான செம்மொழிகளில் ஒன்றாகும்.">📖 History</button>
        <button class="pill" data-text="Artificial intelligence technology is advancing very rapidly across the world.">💡 AI Tech (English)</button>
        <button class="pill" data-text="naalai kaalai 8 manikku mukkiyamaana kalandhuraiaadal thodangugiradhu">🔤 Tanglish Example</button>
      </div>

      <!-- Bottom Toolbar -->
      <div class="bottom-bar">
        <div class="controls-left">
          <!-- Model Badge -->
          <div class="model-badge">
            <span>🐟 Fish Speech S2</span>
          </div>

          <!-- Voice Selector Dropdown -->
          <button class="voice-selector-btn" id="voiceBtn">
            <div class="avatar-circle" id="currentAvatar">👩</div>
            <span id="currentVoiceName">Female 1 (Narrator)</span>
            <span style="color: #94a3b8; font-size: 0.7rem;">▾</span>
          </button>

          <!-- Clone Voice Trigger Button -->
          <button class="btn-clone-trigger" id="btnOpenCloneModal">
            ➕ Clone New Voice
          </button>

          <!-- Voice Dropdown Popover Menu -->
          <div class="dropdown-menu" id="voiceMenu">
            <div class="dropdown-title">
              <span>Select Speaker</span>
              <button style="background:none; border:none; color:#6366f1; cursor:pointer; font-size:0.72rem;" id="btnQuickAddVoice">+ Add Voice</button>
            </div>
            <div id="voiceListContainer">
              <!-- Dynamically populated from /voices -->
            </div>
          </div>

          <!-- More Options / Speed Button -->
          <button class="more-options-btn" id="optionsBtn">
            ⚙️ Controls ▾
          </button>

          <!-- Settings Popover (Speed, Emotion, Stability) -->
          <div class="settings-popover" id="settingsPopover">
            <div class="setting-row">
              <div class="setting-header">
                <span>Speed</span>
                <span id="speedDisplay" style="color: #6366f1;">1.0x</span>
              </div>
              <input type="range" id="speedSlider" min="0.8" max="1.3" step="0.05" value="1.0" />
            </div>
            <div class="setting-row">
              <div class="setting-header">
                <span>Stability</span>
                <span id="stabilityDisplay" style="color: #6366f1;">0.75</span>
              </div>
              <input type="range" id="stabilitySlider" min="0.3" max="1.0" step="0.05" value="0.75" />
            </div>
            <div class="setting-row" style="margin-bottom: 0;">
              <div class="setting-header">
                <span>Emotion / Style</span>
              </div>
              <select id="emotionSelect" style="width: 100%; padding: 6px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 0.8rem; background: #ffffff;">
                <option value="neutral">😐 Neutral / Normal</option>
                <option value="cheerful">😊 Happy & Cheerful</option>
                <option value="narrator">📖 Storyteller / Drama</option>
                <option value="formal">👔 Formal / News</option>
                <option value="surprised">😲 Surprised</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Generate Button -->
        <button class="btn-generate" id="generateBtn">
          <span>↑ Generate Speech</span>
        </button>
      </div>
    </div>

    <!-- Status feedback -->
    <div id="status"></div>

    <!-- Generated Audio Player Card -->
    <div class="audio-player-card" id="audioPlayerCard">
      <audio id="audioElement" controls></audio>
      <a id="downloadBtn" class="download-btn" href="#" download="tamil_speech.wav">
        ⬇️ Download WAV
      </a>
    </div>
  </div>

  <!-- Voice Cloning Modal -->
  <div class="modal-backdrop" id="cloneModal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">
          <span>🎙️ Clone a New Voice</span>
        </div>
        <button class="btn-close-modal" id="btnCloseCloneModal">✕</button>
      </div>

      <div class="form-group">
        <label class="form-label">Voice Name / Speaker Label</label>
        <input type="text" class="form-input" id="cloneVoiceName" placeholder="e.g. My Voice, Vijay, Priya, News Anchor..." />
      </div>

      <div class="form-group">
        <label class="form-label">Gender & Icon</label>
        <div style="display: flex; gap: 10px; align-items: center;">
          <select class="form-input" id="cloneGender" style="flex: 1;">
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="neutral">Neutral</option>
          </select>
          <div class="icon-selector" id="iconSelector">
            <div class="icon-opt active" data-icon="🎙️">🎙️</div>
            <div class="icon-opt" data-icon="👩">👩</div>
            <div class="icon-opt" data-icon="👦">👦</div>
            <div class="icon-opt" data-icon="👨">👨</div>
            <div class="icon-opt" data-icon="🧔">🧔</div>
            <div class="icon-opt" data-icon="🌟">🌟</div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Upload Sample Audio (1 or more .wav / .mp3 clips)</label>
        <div class="audio-dropzone" id="audioDropzone">
          <div style="font-size: 1.5rem; margin-bottom: 4px;">📁</div>
          <div style="font-size: 0.8rem; color: #475569; font-weight: 600;">Click or Drag Audio Sample(s) here</div>
          <div style="font-size: 0.7rem; color: #94a3b8; margin-top: 2px;">(Supports 5-15 seconds clear sample audio)</div>
          <input type="file" id="cloneAudioFiles" multiple accept="audio/*" style="display: none;" />
        </div>
        <div id="selectedFilesSummary" style="font-size: 0.75rem; color: #166534; margin-top: 6px; font-weight: 600;"></div>
      </div>

      <!-- Live Mic Recording Option -->
      <div class="mic-record-box">
        <div>
          <div style="font-size: 0.8rem; font-weight: 600; color: #0f172a;">Or Record from Microphone</div>
          <div style="font-size: 0.7rem; color: #64748b;" id="micStatusText">Click Record & speak 5-10s in Tamil</div>
        </div>
        <button class="btn-mic" id="btnMicRecord">
          <span>● Record</span>
        </button>
      </div>

      <!-- Optional Transcript -->
      <div class="form-group" style="margin-top: 12px;">
        <label class="form-label">Sample Speech Transcript (Optional - Whisper will auto-transcribe if empty)</label>
        <input type="text" class="form-input" id="cloneTranscript" placeholder="வணக்கம், இது எனது மாதிரி குரல் பதிவு..." />
      </div>

      <button class="btn-clone-submit" id="btnSubmitClone">
        ✨ Clone & Register Voice
      </button>
      <div id="cloneModalStatus" style="font-size: 0.76rem; text-align: center; margin-top: 8px; color: #64748b;"></div>
    </div>
  </div>

  <script>
    const API_BASE = (window.location.origin && window.location.origin !== "null" && window.location.origin.startsWith("http"))
      ? window.location.origin
      : "http://localhost:5050";

    let selectedVoice = "female_1";
    let selectedIcon = "🎙️";
    let activeVoices = [];
    let recordedAudioBlob = null;
    let mediaRecorder = null;
    let recordedChunks = [];

    const textInput = document.getElementById("textInput");
    const voiceBtn = document.getElementById("voiceBtn");
    const voiceMenu = document.getElementById("voiceMenu");
    const voiceListContainer = document.getElementById("voiceListContainer");
    const currentAvatar = document.getElementById("currentAvatar");
    const currentVoiceName = document.getElementById("currentVoiceName");
    const optionsBtn = document.getElementById("optionsBtn");
    const settingsPopover = document.getElementById("settingsPopover");
    const speedSlider = document.getElementById("speedSlider");
    const speedDisplay = document.getElementById("speedDisplay");
    const stabilitySlider = document.getElementById("stabilitySlider");
    const stabilityDisplay = document.getElementById("stabilityDisplay");
    const emotionSelect = document.getElementById("emotionSelect");
    const generateBtn = document.getElementById("generateBtn");
    const statusEl = document.getElementById("status");
    const audioPlayerCard = document.getElementById("audioPlayerCard");
    const audioElement = document.getElementById("audioElement");
    const downloadBtn = document.getElementById("downloadBtn");

    // Modal elements
    const btnOpenCloneModal = document.getElementById("btnOpenCloneModal");
    const btnQuickAddVoice = document.getElementById("btnQuickAddVoice");
    const cloneModal = document.getElementById("cloneModal");
    const btnCloseCloneModal = document.getElementById("btnCloseCloneModal");
    const cloneVoiceName = document.getElementById("cloneVoiceName");
    const cloneGender = document.getElementById("cloneGender");
    const cloneAudioFiles = document.getElementById("cloneAudioFiles");
    const audioDropzone = document.getElementById("audioDropzone");
    const selectedFilesSummary = document.getElementById("selectedFilesSummary");
    const btnMicRecord = document.getElementById("btnMicRecord");
    const micStatusText = document.getElementById("micStatusText");
    const cloneTranscript = document.getElementById("cloneTranscript");
    const btnSubmitClone = document.getElementById("btnSubmitClone");
    const cloneModalStatus = document.getElementById("cloneModalStatus");

    // Translator elements
    const btnTranslate = document.getElementById("btnTranslate");
    const btnTransliterate = document.getElementById("btnTransliterate");
    const btnClear = document.getElementById("btnClear");
    const autoTranslateToggle = document.getElementById("autoTranslateToggle");
    const transFeedback = document.getElementById("transFeedback");
    const transFeedbackText = document.getElementById("transFeedbackText");
    const btnApplyTrans = document.getElementById("btnApplyTrans");
    let lastTranslatedText = "";

    // Load available voices dynamically
    async function loadVoices() {
      try {
        const res = await fetch(`${API_BASE}/voices`);
        if (!res.ok) throw new Error("Could not load voices");
        const data = await res.json();
        activeVoices = data.voices || [];
        renderVoiceList();
      } catch (e) {
        console.warn("Using default fallback voices:", e);
      }
    }

    function renderVoiceList() {
      voiceListContainer.innerHTML = "";
      activeVoices.forEach(v => {
        const item = document.createElement("div");
        item.className = `dropdown-item ${v.key === selectedVoice ? "active" : ""}`;
        item.dataset.voice = v.key;
        item.dataset.name = v.label;
        item.dataset.icon = v.icon;

        const customBadge = v.is_custom ? `<span class="item-badge">Custom Cloned</span>` : "";

        item.innerHTML = `
          <span class="item-avatar">${v.icon}</span>
          <div class="item-text">
            <span class="item-name">${v.label} ${customBadge}</span>
            <span class="item-sub">${v.gender}, ${v.style || "Natural"}</span>
          </div>
        `;

        item.addEventListener("click", () => {
          document.querySelectorAll(".dropdown-item").forEach(i => i.classList.remove("active"));
          item.classList.add("active");
          selectedVoice = v.key;
          currentAvatar.textContent = v.icon;
          currentVoiceName.textContent = v.label;
          voiceMenu.classList.remove("show");
        });

        voiceListContainer.appendChild(item);
      });
    }

    // Modal controls
    function openModal() {
      cloneModal.classList.add("show");
      cloneModalStatus.textContent = "";
      voiceMenu.classList.remove("show");
    }
    function closeModal() {
      cloneModal.classList.remove("show");
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
      }
    }

    btnOpenCloneModal.addEventListener("click", openModal);
    btnQuickAddVoice.addEventListener("click", openModal);
    btnCloseCloneModal.addEventListener("click", closeModal);

    // Icon Selector
    document.querySelectorAll(".icon-opt").forEach(opt => {
      opt.addEventListener("click", () => {
        document.querySelectorAll(".icon-opt").forEach(o => o.classList.remove("active"));
        opt.classList.add("active");
        selectedIcon = opt.dataset.icon;
      });
    });

    // Audio File Dropzone
    audioDropzone.addEventListener("click", () => cloneAudioFiles.click());
    cloneAudioFiles.addEventListener("change", () => {
      const count = cloneAudioFiles.files.length;
      if (count > 0) {
        selectedFilesSummary.textContent = `✓ Selected ${count} audio file(s): ${Array.from(cloneAudioFiles.files).map(f=>f.name).join(", ")}`;
      }
    });

    // Mic Recording
    btnMicRecord.addEventListener("click", async () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        btnMicRecord.classList.remove("recording");
        btnMicRecord.innerHTML = "<span>● Record</span>";
        micStatusText.textContent = "✓ Audio recording captured!";
      } else {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          recordedChunks = [];
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = e => {
            if (e.data.size > 0) recordedChunks.push(e.data);
          };
          mediaRecorder.onstop = () => {
            recordedAudioBlob = new Blob(recordedChunks, { type: "audio/wav" });
            selectedFilesSummary.textContent = "✓ Microphone sample recorded ready for cloning!";
          };
          mediaRecorder.start();
          btnMicRecord.classList.add("recording");
          btnMicRecord.innerHTML = "<span>■ Stop</span>";
          micStatusText.textContent = "🎙️ Recording... Speak clearly in Tamil!";
        } catch (err) {
          alert("Microphone access error: " + err.message);
        }
      }
    });

    // Submit Voice Clone
    btnSubmitClone.addEventListener("click", async () => {
      const name = cloneVoiceName.value.trim();
      if (!name) {
        alert("Please enter a name for the voice.");
        return;
      }

      const formData = new FormData();
      formData.append("name", name);
      formData.append("gender", cloneGender.value);
      formData.append("icon", selectedIcon);
      formData.append("transcript", cloneTranscript.value.trim());

      const files = cloneAudioFiles.files;
      if (files && files.length > 0) {
        for (let i = 0; i < files.length; i++) {
          formData.append("audio_files", files[i]);
        }
      } else if (recordedAudioBlob) {
        formData.append("audio_files", recordedAudioBlob, "mic_recording.wav");
      } else {
        alert("Please upload at least 1 audio file or record from microphone.");
        return;
      }

      btnSubmitClone.disabled = true;
      btnSubmitClone.innerHTML = "⏳ Processing & Auto-Transcribing with Whisper...";
      cloneModalStatus.textContent = "Standardizing audio and extracting acoustic voice features...";

      try {
        const res = await fetch(`${API_BASE}/clone_voice`, {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Cloning failed");

        cloneModalStatus.textContent = "✅ Voice cloned successfully!";
        await loadVoices();
        selectedVoice = data.voice_key;
        currentAvatar.textContent = data.icon;
        currentVoiceName.textContent = data.label;
        renderVoiceList();

        setTimeout(() => {
          closeModal();
          statusEl.textContent = `🎉 Cloned '${data.label}' ready to speak!`;
          statusEl.className = "success";
        }, 800);
      } catch (err) {
        cloneModalStatus.textContent = `❌ Error: ${err.message}`;
      } finally {
        btnSubmitClone.disabled = false;
        btnSubmitClone.innerHTML = "✨ Clone & Register Voice";
      }
    });

    // Translation logic
    async function fallbackClientTranslate(text) {
      const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ta&dt=t&q=" + encodeURIComponent(text);
      const res = await fetch(url);
      const data = await res.json();
      return data[0].map(part => part[0]).join("").trim();
    }

    async function performTranslation(mode = "translate") {
      const text = textInput.value.trim();
      if (!text) {
        statusEl.textContent = "Please enter text to translate.";
        statusEl.className = "error";
        return;
      }

      const originalBtnText = mode === "translate" ? btnTranslate.innerHTML : btnTransliterate.innerHTML;
      if (mode === "translate") btnTranslate.innerHTML = "⏳ Translating...";
      else btnTransliterate.innerHTML = "⏳ Converting...";

      statusEl.textContent = mode === "translate" ? "Translating English text to Tamil..." : "Converting Tanglish phonetics to Tamil...";
      statusEl.className = "";

      try {
        let translatedResult = "";
        try {
          const res = await fetch(`${API_BASE}/translate`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: text, mode: mode })
          });
          const data = await res.json();
          if (res.ok && data.translated) {
            translatedResult = data.translated;
          }
        } catch (backendErr) {
          console.warn("Backend /translate fetch failed, using fallback...", backendErr);
        }

        if (!translatedResult && mode === "translate") {
          translatedResult = await fallbackClientTranslate(text);
        }

        if (!translatedResult) {
          throw new Error("Unable to translate text.");
        }

        lastTranslatedText = translatedResult;
        textInput.value = translatedResult;
        transFeedbackText.innerHTML = `<strong>✨ Translated to Tamil:</strong> "${translatedResult}"`;
        transFeedback.classList.add("show");

        statusEl.textContent = "✅ Successfully translated to Tamil script!";
        statusEl.className = "success";
      } catch (err) {
        statusEl.textContent = `❌ Translation error: ${err.message}`;
        statusEl.className = "error";
      } finally {
        if (mode === "translate") btnTranslate.innerHTML = originalBtnText;
        else btnTransliterate.innerHTML = originalBtnText;
      }
    }

    btnTranslate.addEventListener("click", () => performTranslation("translate"));
    btnTransliterate.addEventListener("click", () => performTranslation("transliterate"));
    btnClear.addEventListener("click", () => {
      textInput.value = "";
      transFeedback.classList.remove("show");
      statusEl.textContent = "";
    });

    btnApplyTrans.addEventListener("click", () => {
      if (lastTranslatedText) {
        textInput.value = lastTranslatedText;
      }
      transFeedback.classList.remove("show");
    });

    // Dropdown toggles
    voiceBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      voiceMenu.classList.toggle("show");
      settingsPopover.classList.remove("show");
    });

    optionsBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      settingsPopover.classList.toggle("show");
      voiceMenu.classList.remove("show");
    });

    document.addEventListener("click", () => {
      voiceMenu.classList.remove("show");
      settingsPopover.classList.remove("show");
    });

    // Quick Prompt Pills
    document.querySelectorAll(".pill").forEach(pill => {
      pill.addEventListener("click", () => {
        textInput.value = pill.dataset.text;
        transFeedback.classList.remove("show");
      });
    });

    speedSlider.addEventListener("input", (e) => {
      speedDisplay.textContent = parseFloat(e.target.value).toFixed(2) + "x";
    });
    stabilitySlider.addEventListener("input", (e) => {
      stabilityDisplay.textContent = parseFloat(e.target.value).toFixed(2);
    });

    // Generate Audio
    let timerInterval = null;
    generateBtn.addEventListener("click", async () => {
      const text = textInput.value.trim();
      if (!text) {
        statusEl.textContent = "Please enter text to generate.";
        statusEl.className = "error";
        return;
      }

      generateBtn.disabled = true;
      let secondsElapsed = 0;
      generateBtn.innerHTML = `<span>⏳ Synthesizing (0s)...</span>`;
      statusEl.textContent = "Synthesizing custom Tamil speech with Fish Speech S2...";
      statusEl.className = "";
      audioPlayerCard.classList.remove("show");

      timerInterval = setInterval(() => {
        secondsElapsed++;
        generateBtn.innerHTML = `<span>⏳ Synthesizing (${secondsElapsed}s)...</span>`;
      }, 1000);

      try {
        const res = await fetch(`${API_BASE}/generate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text: text,
            voice: selectedVoice,
            speed: parseFloat(speedSlider.value),
            stability: parseFloat(stabilitySlider.value),
            emotion: emotionSelect.value,
            auto_translate: autoTranslateToggle.checked
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Generation error");

        if (data.transliterated_text && data.transliterated_text !== text) {
          transFeedbackText.innerHTML = `<strong>🎙️ Spoken Tamil Script:</strong> "${data.transliterated_text}"`;
          transFeedback.classList.add("show");
        }

        const audioSrc = "data:audio/wav;base64," + data.audio_b64;
        audioElement.src = audioSrc;
        downloadBtn.href = audioSrc;
        downloadBtn.download = `${selectedVoice}_speech.wav`;

        audioPlayerCard.classList.add("show");
        audioElement.play();
        statusEl.textContent = `✅ Generated successfully in ${secondsElapsed}s!`;
        statusEl.className = "success";
      } catch (err) {
        statusEl.textContent = `❌ ${err.message}`;
        statusEl.className = "error";
      } finally {
        clearInterval(timerInterval);
        generateBtn.disabled = false;
        generateBtn.innerHTML = "<span>↑ Generate Speech</span>";
      }
    });

    // Initial load
    loadVoices();
  </script>
</body>
</html>
